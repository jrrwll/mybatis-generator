# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Build Native Binaries

on:
  push:
    tags:
      - 'v*'        # such as: v1.0.0
    branches: [ "master" ]

jobs:
  build-native:
    name: Build Native - ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: amd64
            artifact_name: code-generator_linux_amd64
            native_dir: build/native/nativeCompile
          - os: ubuntu-latest
            platform: linux
            arch: aarch64
            artifact_name: code-generator_linux_aarch64
            native_dir: build/native/nativeCompile
          - os: macos-13
            platform: macos
            arch: amd64
            artifact_name: code-generator_macos_amd64
            native_dir: build/native/nativeCompile
          - os: macos-latest
            platform: macos
            arch: aarch64
            artifact_name: code-generator_macos_aarch64
            native_dir: build/native/nativeCompile
          - os: windows-latest
            platform: windows
            arch: amd64
            artifact_name: code-generator_windows_amd64
            native_dir: build/native/nativeCompile

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'

      - name: Install musl-tools for static linking (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
        if: matrix.platform == 'linux' && matrix.arch == 'amd64'

      # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
      # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
        with:
          gradle-version: '9.1.0'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        if: runner.os != 'Windows'

      - name: Test with Gradle
        run: ./gradlew :test --info --stacktrace

      - name: Native Compile with Gradle
        run: |
          if [ "${{ matrix.platform }}" = "linux" ]; then
            if [ "${{ matrix.arch }}" = "amd64" ]; then
              export GRAALVM_NATIVE_IMAGE_OPTS="-H:Name=code-generator --static --libc=musl -H:+ReportExceptionStackTraces"
            else
              export GRAALVM_NATIVE_IMAGE_OPTS="-H:Name=code-generator --static -H:+ReportExceptionStackTraces"
            fi
          elif [ "${{ matrix.platform }}" = "macos" ]; then
            if [ "${{ matrix.arch }}" = "amd64" ]; then
              export GRAALVM_NATIVE_IMAGE_OPTS="-H:Name=code-generator -H:+ReportExceptionStackTraces"
            else
              export GRAALVM_NATIVE_IMAGE_OPTS="-H:Name=code-generator -H:+ReportExceptionStackTraces"
            fi
          elif [ "${{ matrix.platform }}" = "windows" ]; then
            echo "Building for Windows"
          fi
          ./gradlew :nativeCompile --info --stacktrace

      - name: Package artifacts
        shell: bash
        run: |
          mkdir -p dist

          if [ -d "${{ matrix.native_dir }}" ]; then
            echo "Copying files from ${{ matrix.native_dir }}"
            cp -r ${{ matrix.native_dir }}/* dist/ 2>/dev/null || true
          fi

          find build -type f -executable -exec cp {} dist/ \; 2>/dev/null || true
          find build -name "*.exe" -exec cp {} dist/ \; 2>/dev/null || true
          find build -name "*.dll" -exec cp {} dist/ \; 2>/dev/null || true
          find build -name "*.so" -exec cp {} dist/ \; 2>/dev/null || true
          find build -name "*.dylib" -exec cp {} dist/ \; 2>/dev/null || true

          # Rename executable to code-generator
          if [ "${{ matrix.platform }}" = "windows" ]; then
            find dist -name "*.exe" -exec basename {} .exe \; | head -1 | xargs -I {} mv "dist/{}.exe" "dist/code-generator.exe" 2>/dev/null || true
          else
            find dist -type f -executable ! -name "*.sh" -exec basename {} \; | head -1 | xargs -I {} mv "dist/{}" "dist/code-generator" 2>/dev/null || true
          fi

          echo "Packaged files:"
          ls -la dist/

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/
          retention-days: 30

  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: build-native
    if: success() && startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Extract version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p final-release

          for platform_dir in release-artifacts/*; do
            if [ -d "$platform_dir" ]; then
              platform=$(basename "$platform_dir")

              # Determine the platform string for filename
              if [[ "$platform" == *"linux"* && "$platform" == *"amd64"* ]]; then
                platform_str="linux_amd64"
              elif [[ "$platform" == *"linux"* && "$platform" == *"aarch64"* ]]; then
                platform_str="linux_aarch64"
              elif [[ "$platform" == *"macos"* && "$platform" == *"amd64"* ]]; then
                platform_str="mac_amd64"
              elif [[ "$platform" == *"macos"* && "$platform" == *"aarch64"* ]]; then
                platform_str="mac_aarch64"
              elif [[ "$platform" == *"windows"* && "$platform" == *"amd64"* ]]; then
                platform_str="windows_amd64"
              else
                continue
              fi

              mkdir -p "temp_package"
              cp -r "$platform_dir"/* "temp_package/" 2>/dev/null || true

              cd "temp_package"
              chmod +x code-generator 2>/dev/null || true
              chmod +x code-generator.exe 2>/dev/null || true

              # Create versioned archive
              if [[ "$platform" == *"windows"* ]]; then
                zip -r "../final-release/code-generator_${VERSION}_${platform_str}.zip" . 2>/dev/null || true
              else
                tar -czf "../final-release/code-generator_${VERSION}_${platform_str}.tar.gz" . 2>/dev/null || true
              fi

              cd ..
              rm -rf temp_package
            fi
          done

          echo "Final release assets:"
          find final-release -type f -print

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: final-release/**/*
          body: |
            Native binaries for ${{ github.ref_name }}

            ## Supported Platforms
            - Linux (x86_64)
            - macOS (x86_64)
            - macOS (ARM64) 
            - Windows (x86_64)

            ## Download
            Download the compressed package for the corresponding platform, decompress it and use it.

            ## Checksums
            SHA256 checksums:
            ```bash
            # Linux
            sha256sum code-generator_linux_amd64.tar.gz

            # macOS Intel
            sha256sum code-generator_macos_amd64.tar.gz

            # macOS Apple Silicon
            sha256sum code-generator_macos_aarch64.tar.gz
            
            # Windows
            sha256sum code-generator_windows_amd64.tar.gz
            ```
          draft: false
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
