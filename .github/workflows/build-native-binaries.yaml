# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Build Native Binaries

on:
  push:
    tags:
      - 'v*'        # such as: v1.0.0
    branches: [ "master" ]

jobs:
  build-native:
    name: Build Native - ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact_name: linux-amd64
            native_dir: build/native
          - os: macos-latest
            platform: macos
            artifact_name: macos-amd64
            native_dir: build/native
          - os: macos-latest
            platform: macos-aarch64
            artifact_name: macos-aarch64
            native_dir: build/native
          - os: windows-latest
            platform: windows
            artifact_name: windows-amd64
            native_dir: build/native

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
      # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
        with:
          gradle-version: '9.1.0'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        if: runner.os != 'Windows'

      - name: Test with Gradle
        run: ./gradlew :test --info --stacktrace

      - name: Native Compile with Gradle
        run: ./gradlew :nativeCompile --info --stacktrace

      - name: Package artifacts
        shell: bash
        run: |
            mkdir -p dist
            
            if [ -d "${{ matrix.native_dir }}" ]; then
              echo "Copying files from ${{ matrix.native_dir }}"
              cp -r ${{ matrix.native_dir }}/* dist/ 2>/dev/null || true
            fi

            find build -type f -executable -exec cp {} dist/ \; 2>/dev/null || true
            find build -name "*.exe" -exec cp {} dist/ \; 2>/dev/null || true
            find build -name "*.dll" -exec cp {} dist/ \; 2>/dev/null || true
            find build -name "*.so" -exec cp {} dist/ \; 2>/dev/null || true
            find build -name "*.dylib" -exec cp {} dist/ \; 2>/dev/null || true
            
            echo "Version: ${{ github.ref_name }}" > dist/version.txt
            echo "Platform: ${{ matrix.platform }}" >> dist/version.txt
            echo "Build Date: $(date -u)" >> dist/version.txt
            echo "Commit: ${{ github.sha }}" >> dist/version.txt

            echo "Packaged files:"
            ls -la dist/
          
      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/
          retention-days: 30

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build-native
    if: success() && startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p final-release

          for platform in linux-amd64 macos-amd64 macos-aarch64 windows-amd64; do
            if [ -d "release-artifacts/$platform" ]; then
              mkdir -p "final-release/$platform"
              cp -r "release-artifacts/$platform"/* "final-release/$platform/" 2>/dev/null || true

              cd "final-release/$platform"
              tar -czf "../$platform.tar.gz" . 2>/dev/null || true
              cd ../..
            fi
          done

          echo "Final release assets:"
          find final-release -type f -print

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: final-release/**/*
          body: |
            Native binaries for ${{ github.ref_name }}

            ## Supported Platforms
            - Linux (x86_64)
            - macOS (x86_64)
            - macOS (ARM64) 
            - Windows (x86_64)

            ## Download
            Download the compressed package for the corresponding platform, decompress it and use it.

            ## Checksums
            SHA256 checksums:
            ```bash
            # Linux
            sha256sum linux-amd64.tar.gz

            # macOS Intel
            sha256sum macos-amd64.tar.gz

            # macOS Apple Silicon
            sha256sum macos-aarch64.tar.gz

            # Windows
            sha256sum windows-amd64.tar.gz
            ```
          draft: false
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
